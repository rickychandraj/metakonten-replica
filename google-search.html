<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sepri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #191a1a; --side: #202222; --panel: #202222; --raised: #2a2c2c;
    --fg: #e8e8e6; --muted: #8d9191; --border: #343636; --accent: #20b8cd; --accent-fg: #0e1a1c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
    display: flex; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  /* Sidebar */
  aside {
    width: 220px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 16px 12px; gap: 4px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; font-size: 20px; font-weight: 600; letter-spacing: -.3px; }
  .brand .mark { width: 28px; height: 28px; color: var(--accent); }
  .new {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--raised); border: 1px solid var(--border); border-radius: 999px;
    padding: 9px 14px; margin-bottom: 12px; cursor: pointer; font-size: 14px;
  }
  .new:hover { border-color: #4a4d4d; }
  .new kbd { font-family: inherit; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .nav a {
    display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px;
    font-size: 14px; color: var(--muted);
  }
  .nav a:hover, .nav a.active { background: var(--raised); color: var(--fg); }
  .nav svg { width: 18px; height: 18px; flex-shrink: 0; }
  .side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; font-size: 14px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 600; font-size: 13px; }

  /* Main */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 0 16px; overflow-y: auto; }
  .center { width: 100%; max-width: 680px; margin-top: 22vh; }
  h1 { font-size: 34px; font-weight: 400; text-align: center; margin: 0 0 28px; letter-spacing: -.5px; }

  .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 14px 10px; transition: border-color .15s;
  }
  .box:focus-within { border-color: #4a4d4d; }
  textarea {
    width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--fg);
    font: inherit; font-size: 16px; line-height: 1.5; min-height: 48px; max-height: 200px; padding: 2px 4px;
  }
  textarea::placeholder { color: var(--muted); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .modes { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 2px; }
  .modes button {
    display: flex; align-items: center; gap: 6px; border: 0; background: transparent; cursor: pointer;
    padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--muted);
  }
  .modes button.on { background: var(--raised); color: var(--accent); box-shadow: inset 0 0 0 1px #3d4040; }
  .modes svg { width: 16px; height: 16px; }
  .tools { display: flex; align-items: center; gap: 2px; }
  .ib {
    width: 34px; height: 34px; border: 0; background: transparent; border-radius: 8px; cursor: pointer;
    display: grid; place-items: center; color: var(--muted);
  }
  .ib:hover { background: var(--raised); color: var(--fg); }
  .ib svg { width: 18px; height: 18px; }
  .ib.listening { color: #ff6b6b; }
  .send { background: var(--accent); color: var(--accent-fg); margin-left: 4px; }
  .send:hover { background: #3cc6d8; color: var(--accent-fg); }
  .send:disabled { background: var(--raised); color: var(--muted); cursor: default; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  .chips button {
    display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: transparent;
    border-radius: 999px; padding: 7px 12px; font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .chips button:hover { color: var(--fg); border-color: #4a4d4d; }

  .apps-title { margin: 48px 0 10px; font-size: 13px; color: var(--muted); text-align: center; }
  .workspace { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .workspace a {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 4px; border-radius: 12px; font-size: 12px; color: var(--muted);
  }
  .workspace a:hover { background: var(--panel); color: var(--fg); }
  .workspace img { width: 28px; height: 28px; object-fit: contain; }
  .workspace b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; }

  footer { margin-top: auto; padding: 32px 0 16px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; font-size: 13px; color: var(--muted); }
  footer a:hover { color: var(--fg); }

  .top { display: none; }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { display: none; }
    .top { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 0; }
    .center { margin-top: 10vh; }
    h1 { font-size: 26px; }
    .modes button span { display: none; }
    .workspace { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
  <aside>
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2v20M4 6l8 5 8-5M4 6v8l8 5 8-5V6M4 6h16M12 11 4 18M12 11l8 7"/></svg>
      sepri
    </div>
    <div class="new" id="new">Utas baru <kbd>Ctrl I</kbd></div>
    <nav class="nav">
      <a href="#" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Beranda</a>
      <a href="https://news.google.com" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>Jelajahi</a>
      <a href="https://drive.google.com" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Ruang</a>
      <a href="https://claude.ai/recents" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Pustaka</a>
    </nav>
    <div class="side-foot"><div class="avatar">S</div>Sepri</div>
  </aside>

  <main>
    <div class="top">
      <div class="brand" style="padding:0"><svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2v20M4 6l8 5 8-5M4 6v8l8 5 8-5V6M4 6h16M12 11 4 18M12 11l8 7"/></svg>sepri</div>
      <div class="avatar">S</div>
    </div>

    <div class="center">
      <h1>Apa yang ingin Anda ketahui?</h1>

      <form id="f" class="box">
        <textarea id="q" rows="1" autofocus placeholder="Tanyakan apa saja..." aria-label="Tanyakan apa saja"></textarea>
        <div class="bar">
          <div class="modes" role="tablist" aria-label="Mode">
            <button type="button" class="on" data-mode="search" title="Cari di Google"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Cari</span></button>
            <button type="button" data-mode="ai" title="Tanya Claude"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg><span>Tanya AI</span></button>
            <button type="button" data-mode="lucky" title="Langsung ke hasil teratas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Beruntung</span></button>
          </div>
          <div class="tools">
            <a class="ib" href="https://lens.google.com" target="_blank" title="Telusuri dengan gambar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21 12-8.5 8.5a5 5 0 0 1-7-7L14 5a3.3 3.3 0 0 1 4.7 4.7L10.2 18a1.7 1.7 0 0 1-2.4-2.4L15.5 8"/></svg></a>
            <button type="button" class="ib" id="mic" title="Telusuri dengan suara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
            <button type="submit" class="ib send" id="send" disabled title="Kirim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
        </div>
      </form>

      <div class="chips" id="chips"></div>

      <div class="apps-title">Aplikasi</div>
      <nav class="workspace" id="workspace" aria-label="Google Workspace"></nav>
    </div>

    <footer>
      <a href="#">Tentang</a><a href="#">Privasi</a><a href="#">Persyaratan</a>
      <a href="https://www.google.com/?hl=en" target="_blank">English</a>
      <a href="https://www.google.com/?hl=jw" target="_blank">Basa Jawa</a>
      <a href="https://www.google.com/?hl=su" target="_blank">Basa Sunda</a>
    </footer>
  </main>

<script>
  const f = document.getElementById('f');
  const q = document.getElementById('q');
  const send = document.getElementById('send');
  let mode = 'search';

  // Kotak teks tumbuh mengikuti isi
  const resize = () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; };
  q.addEventListener('input', () => { resize(); send.disabled = !q.value.trim(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); }
  });

  // Pilihan mode: Cari (Google), Tanya AI (Claude), Beruntung (hasil teratas)
  const placeholders = { search: 'Tanyakan apa saja...', ai: 'Tanyakan apa saja ke AI...', lucky: 'Langsung ke hasil teratas...' };
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));
    mode = b.dataset.mode;
    q.placeholder = placeholders[mode];
    q.focus();
  }));

  f.addEventListener('submit', e => {
    e.preventDefault();
    const term = q.value.trim();
    if (!term) return;
    const urls = {
      search: 'https://www.google.com/search?q=',
      ai: 'https://claude.ai/new?q=',
      lucky: 'https://www.google.com/search?btnI=1&q=',
    };
    window.open(urls[mode] + encodeURIComponent(term), '_blank');
  });

  // Utas baru: kosongkan kotak (Ctrl/Cmd + I)
  const reset = () => { q.value = ''; resize(); send.disabled = true; q.focus(); };
  document.getElementById('new').addEventListener('click', reset);
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'i') { e.preventDefault(); reset(); }
  });

  // Saran pertanyaan
  const chips = [
    ['📈', 'Tren konten media sosial 2026'],
    ['🍳', 'Resep makan malam cepat'],
    ['✈️', 'Rencana liburan 3 hari di Bali'],
    ['💡', 'Ide bisnis modal kecil'],
  ];
  document.getElementById('chips').innerHTML = chips.map(([ic, t]) => `<button type="button">${ic} ${t}</button>`).join('');
  document.querySelectorAll('#chips button').forEach((b, i) => b.addEventListener('click', () => {
    q.value = chips[i][1]; resize(); send.disabled = false; q.focus();
  }));

  // Deretan aplikasi Google Workspace
  const apps = [
    ['Gmail', 'gmail', 'https://mail.google.com'],
    ['Drive', 'drive', 'https://drive.google.com'],
    ['Docs', 'docs', 'https://docs.google.com/document'],
    ['Sheets', 'sheets', 'https://docs.google.com/spreadsheets'],
    ['Slides', 'slides', 'https://docs.google.com/presentation'],
    ['Forms', 'forms', 'https://docs.google.com/forms'],
    ['Calendar', 'calendar', 'https://calendar.google.com'],
    ['Meet', 'meet', 'https://meet.google.com'],
    ['Chat', 'chat', 'https://chat.google.com'],
    ['Keep', 'keep', 'https://keep.google.com'],
    ['Sites', 'sites', 'https://sites.google.com'],
    ['Contacts', 'https://www.gstatic.com/images/branding/product/2x/contacts_2022_48dp.png', 'https://contacts.google.com'],
    ['Tasks', 'https://www.gstatic.com/images/branding/productlogos/tasks/v10/192px.svg', 'https://tasks.google.com'],
    ['Gemini', 'https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg', 'https://gemini.google.com'],
  ];
  const colors = ['#4285f4', '#ea4335', '#fbbc05', '#34a853'];
  document.getElementById('workspace').innerHTML = apps.map(([name, id, href], i) => `
    <a href="${href}" target="_blank" title="Google ${name}">
      <img src="${id.startsWith('http') ? id : `https://www.gstatic.com/images/branding/product/2x/${id}_2020q4_48dp.png`}" alt=""
           onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'${name[0]}',style:'background:${colors[i % 4]}'}))">
      <span>${name}</span>
    </a>`).join('');

  // Pencarian suara (Chrome / Safari)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById('mic');
  mic.addEventListener('click', () => {
    if (!SR) { alert('Browser ini tidak mendukung pencarian suara.'); return; }
    const rec = new SR();
    rec.lang = 'id-ID';
    rec.onstart = () => mic.classList.add('listening');
    rec.onend = () => mic.classList.remove('listening');
    rec.onresult = ev => { q.value = ev.results[0][0].transcript; resize(); send.disabled = false; f.requestSubmit(); };
    rec.start();
  });
</script>
</body>
</html>
